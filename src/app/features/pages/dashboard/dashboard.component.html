<div class="dashboard-container">

  <mat-card class="resumo-card saldo">
    <mat-card-title>Saldo Total</mat-card-title>
    <mat-card-content>
      <h2>{{ valorTotal | currency:'BRL' }}</h2>
    </mat-card-content>
  </mat-card>

  <mat-card class="resumo-card receitas">
    <mat-card-title>Total de Receitas</mat-card-title>
    <mat-card-content>
      <h2>{{ totalReceitas | currency:'BRL' }}</h2>
    </mat-card-content>
  </mat-card>

  <mat-card class="resumo-card manual">
    <mat-card-title>Despesas</mat-card-title>
    <mat-card-content>
      <h2>R$ 0.00</h2>
    </mat-card-content>
  </mat-card>

</div>
