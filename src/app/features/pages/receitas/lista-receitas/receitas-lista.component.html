<div class="container mt-4">
  <h1 class="mb-4 text-primary">📋 Lista de Receitas</h1>

  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered align-middle">
      <thead class="table-primary">
        <tr>
          <th>💰 Valor</th>
          <th>📝 Descrição</th>
          <th>🏷️ Categoria</th>
          <th class="text-center">⚙️ Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let receita of list">
          <td class="text-success fw-bold">R$ {{ receita.valorReceita | number:'1.2-2' }}</td>
          <td>{{ receita.descricaoRecebimento }}</td>
          <td>{{ receita.categoriaReceita || 'Não informada' }}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-2" (click)="editarReceita(receita)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="abrirModalExclusao(receita)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div> 

  <!-- Modal -->
  <div class="modal fade" id="confirmarExclusaoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Excluir Receita</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          Tem certeza que deseja excluir esta receita?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" (click)="confirmarExclusao()">Excluir</button>
        </div>
      </div>
    </div>
  </div>

</div>
